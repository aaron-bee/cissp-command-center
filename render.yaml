services:
  - type: web
    name: certification-command-center
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python database.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health

    envVars:
      - key: DATABASE_PATH
        value: /var/data/cissp.db

      - key: SECRET_KEY
        generateValue: true

      # Used only to bootstrap the first/admin account during v1.2 migration.
      # Existing Render values can remain in place.
      - key: DASHBOARD_USERNAME
        sync: false

      - key: DASHBOARD_PASSWORD
        sync: false

      - key: DASHBOARD_DISPLAY_NAME
        value: Aaron

    disk:
      name: certification-command-center-data
      mountPath: /var/data
      sizeGB: 1
